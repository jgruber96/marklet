[package]
name = "nova-md"
version = "0.1.0"
description = "Nova MD — a Markdown editor"
authors = ["DarkstarDEV"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-store = "2"
tauri-plugin-opener = "2"
