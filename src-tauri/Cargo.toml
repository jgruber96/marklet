[package]
name = "marklet"
version = "0.7.0"
description = "Marklet — a Markdown editor"
authors = ["DarkstarDEV"]
license = "MIT"
edition = "2021"

# The app is a library so iOS can load it; src/main.rs is the desktop entry point.
# The "_lib" suffix keeps it from clashing with the binary's name on Windows.
[lib]
name = "marklet_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-store = "2"
tauri-plugin-opener = "2"
tauri-plugin-clipboard-manager = "2"
base64 = "0.22"

# Desktop only: iOS has no folder watcher, system trash, window state, second
# launches or self-updates (the App Store updates the app).
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
notify-debouncer-mini = "0.7.0"
trash = "5.2.9"
tauri-plugin-window-state = "2.5.0"
tauri-plugin-single-instance = "2.5.5"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

[target.'cfg(windows)'.dependencies]
# Same versions Tauri's wry uses, for WebView2's PrintToPdf.
webview2-com = "0.39"
windows = "0.62"
