# Builds the iPhone and iPad app and uploads it to TestFlight.
#
# Runs on every version tag, alongside the desktop release (see release.yml),
# and by hand from Actions > TestFlight > Run workflow. A hand-started run
# only builds and signs, unless "upload" is ticked: use it to check signing
# without sending a build to testers.
#
# Signing is automatic: Xcode creates or reuses the App Store distribution
# certificate and profile for the DarkstarDEV team (developmentTeam in
# tauri.conf.json) through the App Store Connect API key, which needs the
# Admin role for that. It is the same key the macOS release notarizes with:
#   APPLE_API_ISSUER   the key's issuer ID
#   APPLE_API_KEY      the key ID
#   APPLE_API_KEY_P8   the contents of its AuthKey_<id>.p8 file
#
# The build number is 100 plus this workflow's run number, so it always rises
# and stays clear of builds uploaded by hand (README: Releasing to TestFlight).
# App Store Connect turns version 0.7.1 with build 104 into 0.7.1 (104).

name: TestFlight

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      upload:
        description: Upload the build to TestFlight (otherwise build and sign only)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  ios:
    runs-on: macos-latest
    env:
      UPLOAD: ${{ github.event_name == 'push' || inputs.upload }}
      BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci

      - name: Check the tag against the app version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          conf=$(node -p "require('./src-tauri/tauri.conf.json').version")
          if [ "$tag" != "$conf" ]; then
            echo "::error::Tag $tag does not match the app version $conf."
            exit 1
          fi

      - name: Tools Tauri's iOS build uses
        run: command -v xcodegen >/dev/null || brew install xcodegen

      - name: App Store Connect API key
        env:
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          if [ -z "$APPLE_API_ISSUER" ] || [ -z "$APPLE_API_KEY" ] || [ -z "$APPLE_API_KEY_P8" ]; then
            echo "::error::Set the APPLE_API_ISSUER, APPLE_API_KEY and APPLE_API_KEY_P8 secrets."
            exit 1
          fi
          # Where altool looks for the key, and the path Tauri passes on to Xcode.
          dir="$HOME/.appstoreconnect/private_keys"
          mkdir -p "$dir"
          printf '%s\n' "$APPLE_API_KEY_P8" > "$dir/AuthKey_$APPLE_API_KEY.p8"
          echo "APPLE_API_KEY_PATH=$dir/AuthKey_$APPLE_API_KEY.p8" >> "$GITHUB_ENV"

      - name: Build and sign
        env:
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        run: |
          build=$((100 + BUILD_NUMBER))
          echo "Build number $build"
          npm run tauri ios build -- --export-method app-store-connect --build-number "$build"

      - name: Find the app
        id: ipa
        run: |
          ipa=$(find src-tauri/gen/apple/build -name '*.ipa' -print -quit)
          if [ -z "$ipa" ]; then
            echo "::error::The build made no .ipa."
            exit 1
          fi
          echo "Built $ipa"
          echo "path=$ipa" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7
        with:
          name: marklet-ios
          path: ${{ steps.ipa.outputs.path }}

      - name: Upload to TestFlight
        if: env.UPLOAD == 'true'
        env:
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        run: |
          xcrun altool --upload-app --type ios --file "${{ steps.ipa.outputs.path }}" \
            --apiKey "$APPLE_API_KEY" --apiIssuer "$APPLE_API_ISSUER"
          echo "Uploaded. App Store Connect processes it in about 10–20 minutes, then it appears in TestFlight."
