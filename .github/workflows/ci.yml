# Checks every push and pull request: types, front-end tests, production
# build and the Rust tests on Windows and macOS, and a smoke test of the
# running app on Windows.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - name: Types and production build
        run: npm run build
      - name: Front-end tests
        run: npm test
      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

  # Starts the real app on Windows and drives it through its main features (tests/smoke/run.mjs).
  smoke:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: smoke
      - run: npm ci
      - name: Smoke test
        run: npm run smoke
